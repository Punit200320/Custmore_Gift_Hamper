databases:
  - name: surreal-treasures-db
    databaseName: visit
    user: surreal_user
    plan: free

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: surreal-treasures-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: surreal-treasures-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. React Vite Frontend Static Site
  - type: web
    name: surreal-treasures-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: surreal-treasures-backend
          property: host
